<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#050816">

  <title>EVA AI</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="app">

    <header>

      <div class="logo">E</div>

      <div>

        <h1>EVA AI</h1>

        <p>Your personal AI assistant</p>

      </div>

      <span class="status">● ONLINE</span>

    </header>

    <section class="orb-section">

      <div class="orb"><div class="orb-core"></div></div>

      <h2 id="status">Hello, I'm EVA</h2>

      <p>Talk to me or type your message below.</p>

    </section>

    <section id="chat" class="chat">

      <div class="bubble eva">Hi! I'm EVA AI. How can I help you?</div>

    </section>

    <form id="chat-form">

      <input id="message" placeholder="Ask EVA anything..." autocomplete="off" required>

      <button type="button" id="mic" aria-label="Voice input">🎙️</button>

      <button type="submit" id="send">➤</button>

    </form>

    <footer>EVA AI • Your futuristic assistant</footer>

  </main>

  <script src="app.js"></script>

</body>

</html>
